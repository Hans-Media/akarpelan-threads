name: Publish dari Notion (auto affiliate)

# ============================================================
#  Jembatan Notion -> Threads, dengan REM DRIP + THREAD berantai.
#  - Cek Notion tiap 30 menit (jam aktif WIB).
#  - Maks ~1-2 post/hari, jam acak, jeda antar post kejaga.
#  - Tiap "post" bisa berupa THREAD: caption + beberapa reply cerita,
#    lalu 1 reply terakhir isi semua link. Dikontrol lewat field:
#      * Narasi  = bagian thread, dipisah baris "===" (bagian 1 = post utama, sisanya reply cerita).
#      * Reply   = reply TERAKHIR (biasanya kumpulan link). Boleh kosong.
#  Butuh 2 secret: THREADS_ACCESS_TOKEN + NOTION_TOKEN.
# ============================================================

on:
  schedule:
    - cron: "*/30 1-15 * * *"   # tiap 30 menit, 08:00-22:00 WIB
  workflow_dispatch:             # tes manual = paksa 1 post (abaikan drip)

permissions:
  contents: read

concurrency:
  group: publish-from-notion
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish antrian Notion ke Threads
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          NOTION_DB_ID: "073e2a4c683044179099884dcfff79d3"
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          cat > pub.py <<'PYEOF'
          import json, os, time, random
          from datetime import datetime, timezone, timedelta
          from urllib import request, error, parse

          NOTION = "https://api.notion.com/v1"
          GRAPH = "https://graph.threads.net/v1.0"
          DB = os.environ["NOTION_DB_ID"]
          NT = os.environ["NOTION_TOKEN"]
          TT = os.environ["THREADS_ACCESS_TOKEN"]
          FORCE = os.environ.get("FORCE_POST") == "1"

          # ---- rem drip ----
          DAILY_MAX = 2            # maks affiliate post per hari
          MIN_GAP_MIN = 180        # jeda minimal antar affiliate post (menit)
          PROB = 0.45              # peluang posting tiap run (kalau lolos cap & gap)

          # ---- prioritas kategori (deteksi dari field Catatan) ----
          PRIORITY_TAG = "17 Agustus"   # substring penanda konten 17-an (di properti Catatan)
          PRIORITY_WEIGHT = 0.75        # 75:25 -> 75% ambil dari pool UMUM/CEWE, 25% dari pool 17-an

          WIB = timezone(timedelta(hours=7))

          def notion(method, path, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = request.Request(f"{NOTION}{path}", data=body, method=method)
              req.add_header("Authorization", f"Bearer {NT}")
              req.add_header("Notion-Version", "2022-06-28")
              req.add_header("Content-Type", "application/json")
              try:
                  with request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode())
              except error.HTTPError as e:
                  raise SystemExit(f"[Notion {e.code}] {e.read().decode(errors='replace')}")

          def th_post(url, data):
              req = request.Request(url, data=parse.urlencode(data).encode(), method="POST")
              try:
                  with request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode())
              except error.HTTPError as e:
                  raise RuntimeError(f"[Threads {e.code}] {e.read().decode(errors='replace')}")

          def th_get(url):
              with request.urlopen(url, timeout=60) as r:
                  return json.loads(r.read().decode())

          def uid():
              return th_get(f"{GRAPH}/me?fields=id&access_token={parse.quote(TT)}")["id"]

          def rich(prop):
              arr = (prop or {}).get("rich_text") or (prop or {}).get("title") or []
              return "".join(x.get("plain_text", "") for x in arr)

          def wait_ready(cid):
              for _ in range(20):
                  st = th_get(f"{GRAPH}/{cid}?fields=status&access_token={parse.quote(TT)}").get("status")
                  if st == "FINISHED":
                      return
                  if st == "ERROR":
                      raise RuntimeError("container ERROR")
                  time.sleep(5)

          def post_one(u, text, reply_to=None):
              data = {"media_type": "TEXT", "text": text, "access_token": TT}
              if reply_to:
                  data["reply_to_id"] = reply_to
              cid = th_post(f"{GRAPH}/{u}/threads", data)["id"]
              wait_ready(cid)
              return th_post(f"{GRAPH}/{u}/threads_publish", {"creation_id": cid, "access_token": TT})["id"]

          def permalink(mid):
              return th_get(f"{GRAPH}/{mid}?fields=permalink&access_token={parse.quote(TT)}").get("permalink")

          def publish_thread(u, parts, links_reply):
              prev = None
              main_link = None
              for i, part in enumerate(parts):
                  if not part.strip():
                      continue
                  mid = post_one(u, part, reply_to=prev)
                  if main_link is None:
                      main_link = permalink(mid)
                  prev = mid
                  time.sleep(2)
              if links_reply and links_reply.strip():
                  post_one(u, links_reply, reply_to=prev)
              return main_link

          def today_published():
              q = notion("POST", f"/databases/{DB}/query", {
                  "filter": {"property": "Status", "select": {"equals": "Published"}},
                  "sorts": [{"property": "Tanggal Post", "direction": "descending"}],
                  "page_size": 15,
              })
              now = datetime.now(timezone.utc).astimezone(WIB)
              today = now.date()
              count = 0
              latest = None
              for r in q.get("results", []):
                  d = (r["properties"].get("Tanggal Post") or {}).get("date")
                  if not d or not d.get("start"):
                      continue
                  try:
                      dt = datetime.fromisoformat(d["start"])
                  except Exception:
                      continue
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=WIB)
                  dt = dt.astimezone(WIB)
                  if dt.date() == today:
                      count += 1
                  if latest is None or dt > latest:
                      latest = dt
              return count, latest, now

          def oldest_where(extra_filter):
              q = notion("POST", f"/databases/{DB}/query", {
                  "filter": {"and": [
                      {"property": "Status", "select": {"equals": "Siap Post"}},
                      extra_filter,
                  ]},
                  "sorts": [{"timestamp": "created_time", "direction": "ascending"}],
                  "page_size": 1,
              })
              rows = q.get("results", [])
              return rows[0] if rows else None

          def next_queued():
              """Ambil antrian berikutnya dengan bobot PRIORITY_WEIGHT buat pool UMUM/CEWE
              (Catatan-nya TIDAK mengandung PRIORITY_TAG), sisanya dari pool 17-an.
              Kalau salah satu pool kosong, otomatis fallback ke pool yang masih ada isinya."""
              priority_row = oldest_where({"property": "Catatan", "rich_text": {"contains": PRIORITY_TAG}})
              general_row = oldest_where({"property": "Catatan", "rich_text": {"does_not_contain": PRIORITY_TAG}})

              if priority_row and not general_row:
                  return priority_row, "17-an (satu-satunya pool terisi)"
              if general_row and not priority_row:
                  return general_row, "umum/cewe (satu-satunya pool terisi)"
              if not priority_row and not general_row:
                  return None, None

              if random.random() < PRIORITY_WEIGHT:
                  return general_row, f"umum/cewe (menang undian {int(PRIORITY_WEIGHT*100)}:{int((1-PRIORITY_WEIGHT)*100)})"
              return priority_row, f"17-an (menang undian {int((1-PRIORITY_WEIGHT)*100)}:{int(PRIORITY_WEIGHT*100)})"

          def main():
              row, why = next_queued()
              if not row:
                  print("Antrian 'Siap Post' kosong.")
                  return
              print(f"Pilih antrian: {why}")

              if not FORCE:
                  count, latest, now = today_published()
                  if count >= DAILY_MAX:
                      print(f"SKIP: udah {count} post hari ini (cap {DAILY_MAX}).")
                      return
                  if latest and (now - latest).total_seconds() < MIN_GAP_MIN * 60:
                      print("SKIP: belum lewat jeda minimal antar post.")
                      return
                  if random.random() >= PROB:
                      print("SKIP: nggak kepilih undian jam ini.")
                      return

              props = row["properties"]
              pid = row["id"]
              judul = rich(props.get("Judul / Produk"))
              narasi = rich(props.get("Narasi"))
              links_reply = rich(props.get("Reply"))
              parts = [p for p in narasi.split("\n===\n")]
              if not any(p.strip() for p in parts):
                  print(f"SKIP: Narasi kosong ({judul}).")
                  return

              u = uid()
              now_iso = datetime.now(timezone.utc).astimezone(WIB).strftime("%Y-%m-%dT%H:%M:%S+07:00")
              try:
                  link = publish_thread(u, parts, links_reply)
                  notion("PATCH", f"/pages/{pid}", {"properties": {
                      "Status": {"select": {"name": "Published"}},
                      "Link Threads": {"url": link},
                      "Tanggal Post": {"date": {"start": now_iso}},
                  }})
                  print(f"PUBLISHED: {judul} -> {link}")
                  summ = os.environ.get("GITHUB_STEP_SUMMARY")
                  if summ:
                      with open(summ, "a", encoding="utf-8") as f:
                          f.write(f"### Publish dari Notion\nPUBLISHED: {judul}\n{link}\n")
              except Exception as e:
                  print(f"GAGAL: {judul} :: {e}")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 pub.py
