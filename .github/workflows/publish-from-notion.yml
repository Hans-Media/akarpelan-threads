name: Publish dari Notion (auto affiliate)

# ============================================================
#  Jembatan: Claude nulis post ke Notion (Status="Siap Post"),
#  workflow ini ngecek Notion tiap 30 menit (jam aktif WIB),
#  publish yang "Siap Post" ke Threads, lalu update row jadi
#  "Published" + isi link Threads. Hans nggak operate apa-apa.
#
#  Butuh 2 secret: THREADS_ACCESS_TOKEN (udah ada) + NOTION_TOKEN (baru).
# ============================================================

on:
  schedule:
    - cron: "*/30 1-15 * * *"   # tiap 30 menit, 08:00-22:00 WIB
  workflow_dispatch:             # buat tes manual / publish langsung

permissions:
  contents: read

concurrency:
  group: publish-from-notion
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish antrian Notion ke Threads
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          NOTION_DB_ID: "073e2a4c683044179099884dcfff79d3"
        run: |
          cat > pub.py <<'PYEOF'
          import json, os, time
          from datetime import datetime, timedelta
          from urllib import request, error, parse

          NOTION = "https://api.notion.com/v1"
          GRAPH = "https://graph.threads.net/v1.0"
          DB = os.environ["NOTION_DB_ID"]
          NT = os.environ["NOTION_TOKEN"]
          TT = os.environ["THREADS_ACCESS_TOKEN"]

          def notion(method, path, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = request.Request(f"{NOTION}{path}", data=body, method=method)
              req.add_header("Authorization", f"Bearer {NT}")
              req.add_header("Notion-Version", "2022-06-28")
              req.add_header("Content-Type", "application/json")
              try:
                  with request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode())
              except error.HTTPError as e:
                  raise SystemExit(f"[Notion {e.code}] {e.read().decode(errors='replace')}")

          def th_post(url, data):
              req = request.Request(url, data=parse.urlencode(data).encode(), method="POST")
              try:
                  with request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode())
              except error.HTTPError as e:
                  raise RuntimeError(f"[Threads {e.code}] {e.read().decode(errors='replace')}")

          def th_get(url):
              with request.urlopen(url, timeout=60) as r:
                  return json.loads(r.read().decode())

          def uid():
              return th_get(f"{GRAPH}/me?fields=id&access_token={parse.quote(TT)}")["id"]

          def rich(prop):
              arr = (prop or {}).get("rich_text") or (prop or {}).get("title") or []
              return "".join(x.get("plain_text", "") for x in arr)

          def wait_ready(cid):
              for _ in range(20):
                  st = th_get(f"{GRAPH}/{cid}?fields=status&access_token={parse.quote(TT)}").get("status")
                  if st == "FINISHED":
                      return
                  if st == "ERROR":
                      raise RuntimeError("container ERROR")
                  time.sleep(5)

          def publish(u, text, reply):
              cid = th_post(f"{GRAPH}/{u}/threads", {"media_type": "TEXT", "text": text, "access_token": TT})["id"]
              wait_ready(cid)
              mid = th_post(f"{GRAPH}/{u}/threads_publish", {"creation_id": cid, "access_token": TT})["id"]
              link = th_get(f"{GRAPH}/{mid}?fields=permalink&access_token={parse.quote(TT)}").get("permalink")
              if reply and reply.strip():
                  time.sleep(2)
                  rcid = th_post(f"{GRAPH}/{u}/threads",
                                 {"media_type": "TEXT", "text": reply, "reply_to_id": mid, "access_token": TT})["id"]
                  wait_ready(rcid)
                  th_post(f"{GRAPH}/{u}/threads_publish", {"creation_id": rcid, "access_token": TT})
              return link

          def main():
              q = notion("POST", f"/databases/{DB}/query",
                         {"filter": {"property": "Status", "select": {"equals": "Siap Post"}},
                          "page_size": 5})
              rows = q.get("results", [])
              if not rows:
                  print("Nggak ada yang 'Siap Post'.")
                  return
              u = uid()
              now = (datetime.utcnow() + timedelta(hours=7)).strftime("%Y-%m-%dT%H:%M:%S+07:00")
              done = 0
              for row in rows:
                  pid = row["id"]
                  props = row["properties"]
                  text = rich(props.get("Narasi"))
                  reply = rich(props.get("Reply"))
                  judul = rich(props.get("Judul / Produk"))
                  if not text.strip():
                      print(f"skip (Narasi kosong): {judul}")
                      continue
                  try:
                      link = publish(u, text, reply)
                      notion("PATCH", f"/pages/{pid}", {"properties": {
                          "Status": {"select": {"name": "Published"}},
                          "Link Threads": {"url": link},
                          "Tanggal Post": {"date": {"start": now}},
                      }})
                      print(f"PUBLISHED: {judul} -> {link}")
                      done += 1
                  except Exception as e:
                      print(f"GAGAL: {judul} :: {e}")
              summ = os.environ.get("GITHUB_STEP_SUMMARY")
              if summ:
                  with open(summ, "a", encoding="utf-8") as f:
                      f.write(f"### Publish dari Notion\n{done} post terpublish dari antrian.\n")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 pub.py
